version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/web, /e2e]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
