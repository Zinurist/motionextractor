name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - run: mise run web:build
      - run: mise run lint
      - run: mise run test:web

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browsers: chromium,webkit
          - os: windows-latest
            browsers: chromium
          - os: macos-latest
            browsers: chromium,webkit
    runs-on: ${{ matrix.os }}
    env:
      MX_BROWSERS: ${{ matrix.browsers }}
      # Faster test builds: less debug info (PDB writing makes MSVC links slow) and LLD on Windows.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg and desktop dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev xvfb
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version

      - name: Rust tests
        run: mise run test:rust

      # System dependencies only on Linux: on Windows `--with-deps` adds the Media Foundation
      # feature to the runner image, which takes over 3 minutes.
      - name: Install browsers (and their system dependencies on Linux)
        shell: bash
        run: |
          npm ci --prefix e2e
          deps=()
          if [ "$RUNNER_OS" = Linux ]; then deps=(--with-deps); fi
          node e2e/install-browsers.mjs "${deps[@]}"

      - name: End-to-end tests
        run: mise run e2e

      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a target/debug/motion-extractor --smoke-test
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: target/debug/motion-extractor --smoke-test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
