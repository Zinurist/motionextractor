name: Build

# Reusable: builds installers and CLI archives for every platform and uploads them as artifacts
# named `dist-<target>`. Used by release.yml and nightly.yml.
on:
  workflow_call:
    inputs:
      label:
        description: Version label used in artifact file names (e.g. 0.1.0 or nightly-20261017-abc1234)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      LABEL: ${{ inputs.label }}
      # linuxdeploy (AppImage) runs without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Add Rust targets
        shell: bash
        run: |
          if [ "$TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "$TARGET"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install desktop build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libfuse2 file

      - run: mise run web:build

      - name: Download ffmpeg sidecars
        shell: bash
        run: scripts/fetch-ffmpeg.sh "$TARGET" crates/app/binaries

      - name: Build installers
        shell: bash
        working-directory: crates/app
        run: |
          tauri=../../web/node_modules/.bin/tauri
          if [ "$RUNNER_OS" = Linux ]; then
            # Distribution packages use the system ffmpeg; the AppImage bundles its own.
            $tauri build --target "$TARGET" --bundles deb,rpm
            $tauri build --target "$TARGET" --bundles appimage --config tauri.ffmpeg.conf.json
          else
            $tauri build --target "$TARGET" --config tauri.ffmpeg.conf.json
          fi

      - name: Build the headless CLI
        shell: bash
        run: |
          if [ "$TARGET" = universal-apple-darwin ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --target $t -p motion-extractor --no-default-features
            done
            mkdir -p target/cli
            lipo -create -output target/cli/motion-extractor \
              target/aarch64-apple-darwin/release/motion-extractor target/x86_64-apple-darwin/release/motion-extractor
          else
            cargo build --release --target "$TARGET" -p motion-extractor --no-default-features
            mkdir -p target/cli
            cp target/"$TARGET"/release/motion-extractor* target/cli/
            rm -f target/cli/*.d target/cli/*.pdb
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Installers carry the crate version in their names; use the label instead (a no-op for
          # releases), so nightly files are recognisable.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          bundle=target/"$TARGET"/release/bundle
          find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' f; do
              name=$(basename "$f")
              cp "$f" "dist/${name//$version/$LABEL}"
            done
          cli=motion-extractor-cli-${LABEL}-${TARGET}
          if [ "$RUNNER_OS" = Windows ]; then
            (cd target/cli && 7z a "../../dist/$cli.zip" motion-extractor.exe)
          else
            tar -czf "dist/$cli.tar.gz" -C target/cli motion-extractor
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          # The release (or nightly pre-release) keeps the files people download.
          retention-days: 7
