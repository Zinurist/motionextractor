<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- A moving ball: faded past positions (the frames that cancel out) and the lit motion edge. -->
  <g fill="none" stroke-linecap="round">
    <circle cx="330" cy="560" r="120" stroke="#4f9dff" stroke-opacity="0.18" stroke-width="28"/>
    <circle cx="470" cy="520" r="120" stroke="#4f9dff" stroke-opacity="0.38" stroke-width="28"/>
    <g filter="url(#glow)">
      <path d="M610 360 A160 160 0 0 1 610 680" stroke="#7fe0ff" stroke-width="56"/>
      <path d="M610 360 A160 160 0 0 0 610 680" stroke="#ffffff" stroke-width="20" stroke-opacity="0.9"/>
    </g>
  </g>
</svg>
